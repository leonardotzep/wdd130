<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rafting Xtreme</title>
    <meta name="description"
      content="Contact Rafting Xtreme to book your adventure, ask any questions or learn more about the services.">
    <meta name="author" content="Diego Tzep">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-crossedoars.png" alt="My rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>


    <main>

        <h1>Contact Us - Rafting Xtreme</h1>
        <h2>Send Us a Message</h2>
        <p>Addres: 123 Main River Street, New York, New York, 12345</p>
        <p>Phone number : +502 22334455</p>
        <p>Email: info@none.com</p>

        <div class="map">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15430.370758008152!2d-91.2698596715927!3d14.791957587463003!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x858eb3834c020a21%3A0x2b293c9b0fb4b41e!2sReserva%20Natural%20Coraz%C3%B3n%20del%20Bosque%2C%20El%20Novillero!5e0!3m2!1ses-419!2sgt!4v1791035963826!5m2!1ses-419!2sgt"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>


        <form action="#">
            <label for="name">Name</label>
            <input type="text" name="name" id="name">

            <label for="email">Email</label>
            <input type="email" name="email" id="email">

            <p>Message Purpose</p>
            <label>
                <input type="radio" name="purpose" id="general" value="general">
                General Inquiry
            </label><br>

            <label>
                <input type="radio" name="purpose" id="reservation" value="reservation">
                Reservation Question
            </label><br>

            <label>
                <input type="radio" name="purpose" id="Website" value="Website">
                Website Suggestion
            </label><br>

            <label for="message">Message</label><br>
            <textarea name="message" id="message" placeholder="Type here" rows="5"></textarea><br>

            <input type="checkbox" name="suscribe" id="suscribe">
            <label for="suscribe">Please Suscribe me to the monthly newsletter</label><br>

            <button type="submit">Get in Touch!</button>
        </form>


        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employe-1.jpg" alt="General Manager">
                <figcaption>General Manager</figcaption>
            </figure>
            <figure>
                <img src="images/employe-2.jpg" alt="Lead Guide">
                <figcaption>Lead Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employe-3.jpg" alt="Customer Support">
                <figcaption>Customer Support</figcaption>
            </figure>
        </section>
    </main>


    <footer>
        <p>©2026 | Rafting Xtreme | Diego Tzep</p>
        <nav class="socialmedia">
            <a href="facebook.com">
                <img src="images/facebooklogo3.png" alt="Facebook Logo">
            </a>
            <a href="linkedin.com">
                <img src="images/linkedinlogo1.png" alt="LinkedIn Logo">
            </a>
            <a href="instagram.com">
                <img src="images/instagramlogo1.jpg" alt="Instagram Logo">
            </a>
        </nav>
    </footer>
</body>

</html>
