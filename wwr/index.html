<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Rafting Xtreme</title>
    <meta name="description"
      content="Welcome to Rafting Xtreme, offering thrilling white water rafting adventures, guided trips, and unforgettable experiences.">
    <meta name="author" content="Diego Tzep">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-crossedoars.png" alt="My rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>


    <main>
        <div class="hero">
            <img src="images/rafting_image.jpg" alt="Rafting activity ">
            <h1>Rafting Xtreme</h1>
        </div>


        <section class="section1">
            <div class="newsletter">
                <h2>Stay updated with our discounts and any latest news!</h2>
                <form action="#">
                    <div class="form-in">
                        <input type="text" name="name" id="name" placeholder="Name*" required>

                        <input type="email" name="email" id="email" placeholder="Email*" required>
                    </div>

                    <button type="submit">Subscribe</button>
                </form>
            </div>

            <img src="images/discount1.webp" alt="discount-logo">
        </section>

        <section>
            <div class="cta">
                <p>Ready for your next adventure?</p>
                <a href="trips.html">Explore our trips!</a>
            </div>
        </section>

        <section class="offerings">
            <figure>
                <img src="images/climbing.jpg" alt="Climbing adventure">
                <figcaption>Our purpose and goal is to inspire adventure and connection with nature
                    through white water rafting ensuring safe and guided experiences. </figcaption>
            </figure>

            <figure>
                <img src="images/rio-dulce.webp" alt="Rafting adventure">
                <figcaption>Our offerings include rafting for beginners, family and friendly
                    packages. We also provide group tours and corporate team-building experiences.
                </figcaption>
            </figure>
        </section>
    </main>


    <footer>
        <p>©2026 | Rafting Xtreme | Diego Tzep</p>
        <nav class="socialmedia">
            <a href="facebook.com">
                <img src="images/facebooklogo3.png" alt="Facebook Logo">
            </a>
            <a href="linkedin.com">
                <img src="images/linkedinlogo1.png" alt="LinkedIn Logo">
            </a>
            <a href="instagram.com">
                <img src="images/instagramlogo1.jpg" alt="Instagram Logo">
            </a>
        </nav>
    </footer>
