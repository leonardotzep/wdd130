<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego Tzep | WDD 130</title>
    <meta name="description" content="This is Homepage of Diego Tzep, taking WDD130 course,
    and this page introduces myself and all the info that I want to share with you.">
    <meta name="author" content="Diego Tzep">
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
    </header>

    <main>
        <form action="">
            <div class="form-item column2">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-item column2">
                <label for="useremail">Email Address</label>
                <input type="email" id="useremail" name="useremail" required>
            </div>

            <div class="form-item column1">
                <label for="browser">What is your favorite browser?</label>
                <select name="browser" id="browser">
                    <option value="Chrome">Chrome</option>
                    <option value="Safari">Safari</option>
                    <option value="Edge">Edge</option>
                </select>
            </div>

            <div class="form-item column1">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" name="pet" id="pet">
            </div>

            <label for="feedback">List the places you have lived:</label>
            <textarea name="feedback" id="feedback" placeholder="Guatemala, Mexico, Honduras"
              rows="4"></textarea>

            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
    </footer>
</body>

</html>
